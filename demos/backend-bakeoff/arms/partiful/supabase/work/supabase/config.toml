project_id = "llp0102-partiful-supabase-coord"

[api]
enabled = true
port = 57431
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 57432
shadow_port = 57439
major_version = 17
health_timeout = "2m"

[db.pooler]
enabled = false
port = 57438

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = true
port = 57433
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 57434
smtp_port = 57435
pop3_port = 57436

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:4330"
additional_redirect_urls = ["http://127.0.0.1:4330"]
enable_signup = true
minimum_password_length = 6

[auth.email]
enable_signup = true
enable_confirmations = false
max_frequency = "1s"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 57440

[functions.notify]
verify_jwt = true

[functions.provider-fake]
verify_jwt = false

[analytics]
enabled = false
port = 57437
