name: PartitimeSwiftUI

options:
  bundleIdPrefix: dev.snapback.partitime
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  PartitimeSwiftUI-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Generated/PartitimeSwiftUI-iOS-Info.plist
      properties:
        CFBundleDisplayName: Partitime SwiftUI
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.snapback.partitime.swiftui.ios
        PRODUCT_NAME: PartitimeSwiftUI
        TARGETED_DEVICE_FAMILY: "1,2"

  PartitimeSwiftUI-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Generated/PartitimeSwiftUI-macOS-Info.plist
      properties:
        CFBundleDisplayName: Partitime SwiftUI
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.snapback.partitime.swiftui.macos
        PRODUCT_NAME: PartitimeSwiftUI

  PartitimeSwiftUI-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: PartitimeSwiftUI-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.snapback.partitime.swiftui.ios-uitests
        TEST_TARGET_NAME: PartitimeSwiftUI-iOS

  PartitimeSwiftUI-macOSUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: PartitimeSwiftUI-macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.snapback.partitime.swiftui.macos-uitests
        TEST_TARGET_NAME: PartitimeSwiftUI-macOS

schemes:
  PartitimeSwiftUI-iOS:
    build:
      targets:
        PartitimeSwiftUI-iOS: all
        PartitimeSwiftUI-iOSUITests: [test]
    test:
      targets:
        - PartitimeSwiftUI-iOSUITests

  PartitimeSwiftUI-macOS:
    build:
      targets:
        PartitimeSwiftUI-macOS: all
        PartitimeSwiftUI-macOSUITests: [test]
    test:
      targets:
        - PartitimeSwiftUI-macOSUITests
