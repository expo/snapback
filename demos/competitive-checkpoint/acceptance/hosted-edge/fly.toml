# Fly config for the LLP 0098 hosted-edge profile.
#
# The critical difference from the plaintext drill (`../drill/fly.toml`) is that
# public 443 is a RAW TCP passthrough: Fly's edge does not terminate TLS, so the
# handshake reaches Caddy inside the container. That is what lets the origin bind
# loopback and makes LLP 0060 D2's edge-to-origin clause literally true.
#
# Public 80 keeps the `http` handler purely so the ACME HTTP-01 challenge can
# reach Caddy; no application traffic is served over it.
#
# Deploy from the repository root:
#   fly deploy . \
#     --config demos/competitive-checkpoint/acceptance/hosted-edge/fly.toml \
#     --dockerfile demos/competitive-checkpoint/acceptance/hosted-edge/Dockerfile \
#     --remote-only --ha=false --yes

app = "snapback-drill"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  # The origin bind is loopback, so this profile needs no dev-auth override and
  # never passes --allow-insecure-dev-auth. `test` remains the drill profile.
  SNAPBACK_PROFILE = "test"

# LLP 0098 author decision D4 (Charlie Cheever, 2026-07-25): one small
# persistent volume for Caddy's certificate storage ONLY, so certificates
# survive redeploys and stop/start cycles instead of burning Let's Encrypt
# duplicate-certificate budget. The database and the delivered admission
# chain deliberately stay on the rootfs: a redeploy still gets a fresh
# database (which is what lets sessions stage in a single boot) and a chain
# is re-delivered per deploy window. Volume identity (teardown inventory:
# ../drill/README.md): vol_r6815pkd59o1x614, name caddy_storage, sjc, 1GB;
# attaching it replaced machine 819701c927ee68 with 849764f2e7dd58.
[mounts]
  source = "caddy_storage"
  destination = "/data/caddy"

# Raw TCP passthrough: TLS terminates in the container, not at Fly's edge.
[[services]]
  internal_port = 8443
  protocol = "tcp"
  # Auto-stop stays OFF: certificates now persist on the D4 volume, but the
  # database and the delivered admission chain still live on the rootfs, and
  # one always-on machine keeps both stable between deploys.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    # No handlers: Fly forwards the connection as-is.

# ACME HTTP-01 only.
[[services]]
  internal_port = 8080
  protocol = "tcp"
  # Auto-stop stays OFF: certificates now persist on the D4 volume, but the
  # database and the delivered admission chain still live on the rootfs, and
  # one always-on machine keeps both stable between deploys.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
