# Fly.io app config for the single-instance-container-vm.v1 remote drill.
# Provider tuple pinned by LLP 0075 protocol amendment v0.6: fly.io, region
# sjc, one small Machine, Tigris S3-compatible backup store.
#
# Deploy from the repository root:
#   fly deploy . \
#     --config demos/competitive-checkpoint/acceptance/drill/fly.toml \
#     --dockerfile demos/competitive-checkpoint/acceptance/drill/Dockerfile \
#     --build-arg SNAPBACK_BUILD_GIT_COMMIT="$(git rev-parse HEAD)" \
#     --build-arg SNAPBACK_BUILD_GIT_DIRTY=0 \
#     --remote-only --ha=false
#
# Machine sizing: shared-cpu-1x with 512 MB first (amendment v0.6 posture:
# smallest that works; scale to 1 GB only if the runtime needs it).

app = "snapback-drill"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  # Required, not decorative: the bind is non-loopback, and an unset
  # SNAPBACK_PROFILE fails CLOSED to `prod` on a real interface
  # (src/admin.rs resolve_profile), which refuses dev auth even with
  # --allow-insecure-dev-auth. The drill's recorded posture is profile
  # `test` + explicit insecure-dev-auth override behind Fly's TLS edge.
  SNAPBACK_PROFILE = "test"

[http_service]
  internal_port = 8080
  force_https = true
  # Auto-stop keeps the drill machine parked between passes; rootfs (and the
  # durable rows under /data) survive stop/start, and the instrument's first
  # request wakes it.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

# Preserve the provisioned certificate-state volume across Machine updates.
# The current plaintext Snapback process does not consume this directory, but
# retaining the exact attachment avoids losing the independently governed
# Caddy/ACME custody recorded by LLP 0075 and LLP 0098.
[[mounts]]
  # @ref LLP 0098#84-d4-executed-the-volume-the-redeploy-from-fixed-main-and-the-plaintext-refusal-close-2026-07-25-later — preserve the recorded ACME custody across Machine updates.
  source = "caddy_storage"
  destination = "/data/caddy"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
