# Fly.io app config for assembling a checksum-bound release built on an
# independent high-memory Linux host. Runtime behavior and sizing are identical
# to fly.toml; only the build carrier differs.

app = "snapback-drill"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.prebuilt"

[env]
  SNAPBACK_PROFILE = "test"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  # @ref LLP 0098#84-d4-executed-the-volume-the-redeploy-from-fixed-main-and-the-plaintext-refusal-close-2026-07-25-later — preserve the recorded ACME custody across Machine updates.
  source = "caddy_storage"
  destination = "/data/caddy"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
