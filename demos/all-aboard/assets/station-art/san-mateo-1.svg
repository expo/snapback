      <stop offset="0" stop-color="#f5efe1"/>
      <stop offset="0.5" stop-color="#f2e0c3"/>
      <stop offset="1" stop-color="#eac9a3"/>
    </linearGradient>
    <linearGradient id="sea1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6d3d8"/>
      <stop offset="0.3" stop-color="#a7bdc7"/>
      <stop offset="1" stop-color="#8aa4b5"/>
