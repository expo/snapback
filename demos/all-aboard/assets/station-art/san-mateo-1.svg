  <rect width="640" height="1136" fill="#f5efe1"/>
  <rect x="0" y="0" width="640" height="576" fill="url(#sky1)"/>
  <rect x="0" y="556" width="640" height="480" fill="url(#sea1)"/>

  <!-- calm high sky washes -->
