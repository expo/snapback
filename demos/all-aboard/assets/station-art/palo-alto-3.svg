<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1136">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9bcc6"/>
      <stop offset="0.45" stop-color="#c6cfc9"/>
      <stop offset="1" stop-color="#f5efe1"/>
    </linearGradient>
    <linearGradient id="fog3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ead9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f2ead9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f2ead9" stop-opacity="0"/>
