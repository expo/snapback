<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#C8102E" />
    <!-- Static native discovery (ENG-23643): the Exact native hosts fetch this
         page when opening the deployed URL and follow this link to the build's
         platform manifest (emitted by staticPlatformTargets in vite.config.ts).
         The vite plugin only injects it into HTML it generates itself, so a
         handwritten shell must carry it or native hosts white-screen. -->
    <link rel="exact:platform-manifest" type="application/vnd.exact.platform-manifest+json" href="/__exact/platform-manifest.json" />
    <title>All Aboard — Caltrain</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #exact-root { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
        background: #ffffff;
        overflow: hidden;
      }
      /* Gesture zones (ENG-23719): the red header owns its pointer (station
         swipes); the board scrolls natively and yields only the horizontal
         axis to the train-walk gesture. Double-tap zoom is off app-wide. */
      #exact-root { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
      #exact-root input, #exact-root textarea { -webkit-user-select: text; user-select: text; }
      [data-testid="station-header"] { touch-action: none; }
      [data-testid="board-content"] { touch-action: pan-y; }
      input::placeholder { color: rgba(26, 31, 39, 0.4); }
      #boot-status {
        position: fixed;
        left: 16px;
        bottom: 16px;
        max-width: min(520px, calc(100vw - 32px));
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 10px;
        background: #0d1322;
        color: #dbe3f4;
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      #boot-status[data-state="ready"] { display: none; }
      #boot-status[data-state="error"] { border-color: #b4525f; color: #ffb3bd; }
    </style>
  </head>
  <body>
    <div id="exact-root"></div>
    <div id="boot-status">Booting All Aboard…</div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
