name: ChatMatrixSwiftUI

options:
  bundleIdPrefix: dev.snapback.chatmatrix
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  ChatMatrixSwiftUI-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Generated/ChatMatrixSwiftUI-iOS-Info.plist
      properties:
        CFBundleDisplayName: ChatMatrix SwiftUI
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.snapback.chatmatrix.swiftui.ios
        PRODUCT_NAME: ChatMatrixSwiftUI
        TARGETED_DEVICE_FAMILY: "1,2"

  ChatMatrixSwiftUI-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Generated/ChatMatrixSwiftUI-macOS-Info.plist
      properties:
        CFBundleDisplayName: ChatMatrix SwiftUI
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.snapback.chatmatrix.swiftui.macos
        PRODUCT_NAME: ChatMatrixSwiftUI

schemes:
  ChatMatrixSwiftUI-iOS:
    build:
      targets:
        ChatMatrixSwiftUI-iOS: all

  ChatMatrixSwiftUI-macOS:
    build:
      targets:
        ChatMatrixSwiftUI-macOS: all
