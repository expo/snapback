<!doctype html>
<meta charset="utf-8">
<title>Snapback3 compact acquisition floor</title>
<pre id="status">running</pre>
<script type="module">
const state = window.floorResult = { status: 'running', timeOrigin: performance.timeOrigin, phases: {} };
const mark = (name) => state.phases[name] = performance.now();
const request = (value) => new Promise((resolve, reject) => {
  value.onsuccess = () => resolve(value.result);
  value.onerror = () => reject(value.error);
});
const transactionDone = (tx) => new Promise((resolve, reject) => {
  tx.oncomplete = resolve;
  tx.onerror = () => reject(tx.error);
  tx.onabort = () => reject(tx.error ?? new Error('transaction aborted'));
});
const tokenize = (value) => [...new Set(String(value).toLocaleLowerCase('en-US').match(/[\p{L}\p{N}_]+/gu) ?? [])];
const openDatabase = () => new Promise((resolve, reject) => {
  const opening = indexedDB.open('snapback3-acquisition-floor', 1);
  opening.onupgradeneeded = () => {
    const db = opening.result;
    const messages = db.createObjectStore('messages', { keyPath: 'id' });
    messages.createIndex('byConversationTime', ['conversationId', 'serverTimestamp', 'id']);
    messages.createIndex('bySearchTerm', 'searchTerms', { multiEntry: true });
    db.createObjectStore('conversations', { keyPath: 'id' });
    db.createObjectStore('meta', { keyPath: 'key' });
  };
  opening.onsuccess = () => resolve(opening.result);
  opening.onerror = () => reject(opening.error);
});
const digestIds = async (ids) => {
  const bytes = new TextEncoder().encode(JSON.stringify([...ids].sort()));
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
};

try {
  mark('scriptStart');
  mark('fetchStart');
  const response = await fetch('/compact.json');
  if (!response.ok) throw new Error(`compact fetch ${response.status}`);
  mark('responseHeaders');
  const encoded = await response.arrayBuffer();
  mark('bodyDecoded');
  const jsonText = new TextDecoder().decode(encoded);
  mark('textDecoded');
  const payload = JSON.parse(jsonText);
  mark('jsonParsed');
  if (payload.version !== 1 || payload.actor !== 'u0500') throw new Error('wrong compact payload identity');
  let db = await openDatabase();
  mark('databaseOpened');
  const batchSize = 1000;
  let transactionCount = 0;
  for (let offset = 0; offset < payload.messages.length; offset += batchSize) {
    const tx = db.transaction(['messages'], 'readwrite', { durability: 'relaxed' });
    const store = tx.objectStore('messages');
    for (const tuple of payload.messages.slice(offset, offset + batchSize)) {
      const [id, conversationId, senderId, text, serverTimestamp, replyTo, edited, tombstone] = tuple;
      store.put({ id, conversationId, senderId, text, serverTimestamp, replyTo, edited, tombstone, searchTerms: tokenize(text) });
    }
    await transactionDone(tx);
    transactionCount++;
  }
  {
    const tx = db.transaction(['conversations', 'meta'], 'readwrite', { durability: 'relaxed' });
    for (const tuple of payload.conversations) tx.objectStore('conversations').put({ id: tuple[0], value: tuple[1] });
    tx.objectStore('meta').put({ key: 'complete', actor: payload.actor, messageCount: payload.messages.length, conversationCount: payload.conversations.length, expectedIdsSha256: payload.expectedIdsSha256 });
    await transactionDone(tx);
    transactionCount++;
  }
  mark('persistenceComplete');
  db.close();
  mark('databaseClosed');
  db = await openDatabase();
  mark('databaseReopened');
  const firstConversationId = payload.conversations[0][0];
  const firstMessageText = payload.messages.find(row => row[1] === firstConversationId)?.[3] ?? '';
  const firstSearchTerm = tokenize(firstMessageText)[0];
  const historyTx = db.transaction('messages', 'readonly');
  const historyDone = transactionDone(historyTx);
  const historyRange = IDBKeyRange.bound([firstConversationId, Number.MIN_SAFE_INTEGER, ''], [firstConversationId, Number.MAX_SAFE_INTEGER, '\uffff']);
  const history = await request(historyTx.objectStore('messages').index('byConversationTime').getAll(historyRange, 40));
  await historyDone;
  mark('firstOfflineHistoryComplete');
  const searchTx = db.transaction('messages', 'readonly');
  const searchDone = transactionDone(searchTx);
  const search = await request(searchTx.objectStore('messages').index('bySearchTerm').getAll(firstSearchTerm, 20));
  await searchDone;
  mark('firstOfflineSearchComplete');
  state.primaryComplete = performance.now();
  state.heapBeforeValidationAudit = performance.memory ? {
    usedJSHeapSize: performance.memory.usedJSHeapSize,
    totalJSHeapSize: performance.memory.totalJSHeapSize,
    jsHeapSizeLimit: performance.memory.jsHeapSizeLimit
  } : null;
  mark('validationAuditStart');
  const auditTx = db.transaction(['messages', 'conversations', 'meta'], 'readonly');
  const auditDone = transactionDone(auditTx);
  const [messageKeys, historyIndexKeys, conversationKeys, meta] = await Promise.all([
    request(auditTx.objectStore('messages').getAllKeys()),
    request(auditTx.objectStore('messages').index('byConversationTime').getAllKeys()),
    request(auditTx.objectStore('conversations').getAllKeys()),
    request(auditTx.objectStore('meta').get('complete'))
  ]);
  await auditDone;
  const observedIdsSha256 = await digestIds(messageKeys);
  const historyIndexIdsSha256 = await digestIds(historyIndexKeys);
  mark('validationAuditComplete');
  db.close();
  state.status = 'complete';
  state.payload = { messageCount: payload.messages.length, conversationCount: payload.conversations.length, rawJsonBytes: encoded.byteLength };
  state.persistence = { batchSize, transactionCount };
  state.firstOfflineHistory = { conversationId: firstConversationId, count: history.length, firstId: history[0]?.id, lastId: history.at(-1)?.id };
  state.firstOfflineSearch = { term: firstSearchTerm, count: search.length, ids: search.map(row => row.id) };
  state.audit = {
    uniqueMessageIds: new Set(messageKeys).size,
    messageKeys: messageKeys.length,
    historyIndexKeys: historyIndexKeys.length,
    conversationKeys: conversationKeys.length,
    observedIdsSha256,
    historyIndexIdsSha256,
    expectedIdsSha256: payload.expectedIdsSha256,
    digestMatches: observedIdsSha256 === payload.expectedIdsSha256,
    allExpectedIdsAccessibleThroughHistoryIndex: historyIndexKeys.length === payload.messages.length && historyIndexIdsSha256 === payload.expectedIdsSha256,
    metadata: meta
  };
  document.querySelector('#status').textContent = 'complete';
} catch (error) {
  state.status = 'failed';
  state.error = String(error?.stack ?? error);
  document.querySelector('#status').textContent = state.error;
}
</script>
