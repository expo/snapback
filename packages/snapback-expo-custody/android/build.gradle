plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.snapbackcustody'
version = '0.1.0'

android {
  namespace 'expo.modules.snapbackcustody'
  buildFeatures {
    buildConfig true
  }
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'androidx.datastore:datastore-core:1.2.1'
}
