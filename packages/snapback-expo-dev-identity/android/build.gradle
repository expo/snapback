plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.snapbackdevidentity'
version = '0.1.0'

android {
  namespace 'expo.modules.snapbackdevidentity'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // ReactActivityHandler's callback types live in react-android; the Expo
  // module plugin does not put them on a library module's compile classpath.
  implementation 'com.facebook.react:react-android'
}
