[package]
name = "snapback-security-boundary-fixtures"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false

# Keep compile-fail witnesses outside the product workspace. The gate derives
# the honest mounted-crate inventory from these dependency keys and
# attacks.v1.json rather than trusting descriptive package metadata.
[workspace]

[dependencies]
serde_json = "1"
snapback-kernel = { path = "../../../crates/snapback-kernel" }
snapback-auth = { path = "../../../crates/snapback-auth" }
snapback-activation = { path = "../../../crates/snapback-activation" }
snapback-services = { path = "../../../crates/snapback-services" }
snapback-engine = { path = "../../../crates/snapback-engine" }
snapback-server = { path = "../../../crates/snapback-server" }
snapback-sync = { path = "../../../crates/snapback-sync" }

