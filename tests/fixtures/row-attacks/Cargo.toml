[package]
name = "snapback-row-attack-fixtures"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false

# Keep dependent-crate row attacks outside the product workspace. Each row is
# an explicit bin joined to attacks.v1.json; auto-discovery cannot silently
# turn an unledgered source into corpus coverage.
[workspace]

[features]
default = []
additive = [
  "snapback-auth/test-support",
  "snapback-engine/test-support",
  "snapback-kernel/test-support",
  "snapback-sync/test-support",
  "snapback-types/test-support",
]
services-remainder-tests = ["snapback-services/remainder-tests"]

[dependencies]
libc = "0.2"
serde_json = "1"
tempfile = "3"
tokio = { version = "1.48", features = ["macros", "rt"] }
snapback-auth = { path = "../../../crates/snapback-auth", default-features = false }
snapback-engine = { path = "../../../crates/snapback-engine", default-features = false, features = ["engine-owner"] }
snapback-kernel = { path = "../../../crates/snapback-kernel", default-features = false }
snapback-services = { path = "../../../crates/snapback-services", default-features = false }
snapback-sync = { path = "../../../crates/snapback-sync", default-features = false }
snapback-types = { path = "../../../crates/snapback-types", default-features = false }

