[workspace]
resolver = "3"
members = ["crates/*", "tools/snapback-delta-semantics"]
default-members = ["crates/snapback"]
exclude = [
  "snapback2",
  "snapback3",
  "snapback4",
  "tools/agent-safe-baseline-worker",
  "vendor/ibex",
  "vendor/celld-ltx",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints]

# Keep the ordinary release build suitable for the in-window incremental edit
# loop. The shipped binary uses the dedicated production profile below.
[profile.release]
incremental = true

# @ref LLP 0276#crates--the-rust-workspace — production qualification retains
# the shipped full-LTO shape without imposing it on ordinary release builds.
[profile.production]
inherits = "release"
incremental = false
lto = "fat"
codegen-units = 1
# The compiler output IS the final shipped bytes, so CV-2 loader
# qualification (LLP 0123), source receipts, seals, and measurement all bind
# the same stripped file. Never strip in a packer after a receipt or seal
# exists — that desyncs digests.
# @ref LLP 0314.000#phase-1--ship-the-ship-profile-and-strip-it — 1d.
strip = "symbols"
