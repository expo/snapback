[package]
name = "snapback"
version = "0.1.0"
edition = "2024"
license = "MIT"
default-run = "snapback"
# build.rs emits the macOS LC_RPATH for hermesvm.framework (ENG-22664); a
# dependency's rustc-link-arg does not propagate to this binary's link step.
build = "build.rs"

[lib]
name = "snapback"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
ibex-runtime = { path = "vendor/ibex" }
libc = "0.2"
rusqlite = { version = "0.31", features = ["backup", "bundled", "column_decltype"] }
ryu-js = "1.0.2"
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["full"] }
ureq = { version = "2", features = ["json"] }
uuid = { version = "1.23.4", features = ["v4", "v7", "serde"] }

[dev-dependencies]
jsonschema = "0.46.8"
syn = { version = "2.0", features = ["full", "visit"] }
tempfile = "3.23"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
