[package]
name = "snapback"
version = "0.1.0"
edition = "2024"
license = "MIT"
default-run = "snapback"

[lib]
name = "snapback"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
ibex-runtime = { path = "vendor/ibex" }
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled", "column_decltype"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["full"] }
uuid = { version = "1.23.4", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3.23"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
