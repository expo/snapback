[package]
name = "snapback-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
name = "snapback_engine"
path = "src/lib.rs"

[features]
default = ["engine-owner"]
# The rank-7 remainder includes selected moved sources in its unit-test build
# so upward integration tests retain their original crate-private access.
engine-owner = []

[dependencies]
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
jsonschema = { version = "0.46.8", default-features = false, features = ["resolve-file"] }
libc = "0.2"
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
snapback-activation = { path = "../snapback-activation" }
snapback-auth = { path = "../snapback-auth" }
snapback-kernel = { path = "../snapback-kernel" }
snapback-runtime = { path = "../snapback-runtime" }
snapback-services = { path = "../snapback-services" }
snapback-sync = { path = "../snapback-sync" }
snapback-types = { path = "../snapback-types" }
tokio = { version = "1.48", features = ["full"] }
ureq = { version = "2", features = ["json"] }
uuid = { version = "1.23.4", features = ["v4", "v7", "serde"] }
zeroize = "1.8"

[dev-dependencies]
snapback-activation = { path = "../snapback-activation", features = ["test-support"] }
snapback-auth = { path = "../snapback-auth", features = ["test-support"] }
snapback-kernel = { path = "../snapback-kernel", features = ["test-support"] }
snapback-runtime = { path = "../snapback-runtime", features = ["test-support"] }
snapback-services = { path = "../snapback-services", features = ["remainder-tests"] }
snapback-sync = { path = "../snapback-sync", features = ["test-support"] }
tempfile = "3.23"

[lints]
workspace = true
