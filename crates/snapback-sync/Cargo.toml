[package]
name = "snapback-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "snapback_sync"
path = "src/lib.rs"

[features]
default = ["sync-owner"]
sync-owner = []
test-support = []

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
ring = "0.17"
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
snapback-auth = { path = "../snapback-auth" }
snapback-kernel = { path = "../snapback-kernel" }
snapback-types = { path = "../snapback-types" }
tokio = { version = "1.48", features = ["full"] }
uuid = { version = "1.23.4", features = ["v4", "v7", "serde"] }
zeroize = "1.8"

[dev-dependencies]
snapback-auth = { path = "../snapback-auth", features = ["test-support"] }
snapback-kernel = { path = "../snapback-kernel", features = ["test-support"] }

[lints]
workspace = true
