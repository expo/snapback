[package]
name = "snapback-types"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "snapback_types"
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
base64 = "0.22"
crc32fast = "1"
getrandom = "0.3"
hmac = "0.12"
http = "1"
libc = "0.2"
ring = "0.17"
ryu-js = "1.0.2"
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1.48", features = ["rt", "sync"] }
unicode-normalization = "0.1"
uuid = { version = "1.23.4", features = ["v4", "v7", "serde"] }
zeroize = "1.8"

[dev-dependencies]
jsonschema = { version = "0.46.8", default-features = false, features = ["resolve-file"] }
tempfile = "3.23"

[lints]
workspace = true
