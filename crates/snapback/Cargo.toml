[package]
name = "snapback"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "snapback"
# build.rs emits the macOS LC_RPATH for hermesvm.framework (ENG-22664); a
# dependency's rustc-link-arg does not propagate to this binary's link step.
build = "build.rs"

[lib]
name = "snapback"
path = "src/lib.rs"

[features]
default = []
cli-owner = []
engine-owner = []
server-owner = []
services-owner = []
sync-owner = []
# Internal evidence harness for LLP 0154 Phase 1. This is deliberately absent
# from ordinary contributor/server builds and is enabled only by the bounded
# proof script.
telemetry-phase1-proof = ["snapback-server/benchmark-support"]

[[bin]]
name = "snapback-telemetry-bench"
path = "src/bin/snapback-telemetry-bench.rs"
required-features = ["telemetry-phase1-proof"]

[dependencies]
anyhow = "1.0"
argon2 = "0.6.0-rc.8"
async-trait = "0.1"
base64 = "0.22"
bcrypt = "0.19.3"
chacha20poly1305 = "0.10"
crc32fast = "1"
futures-util = "0.3"
fs2 = "0.4"
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
http = "1"
http-body = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Default features pull remote-$ref HTTP/TLS dependencies. Ask validates only
# caller-supplied in-memory schemas, so keep the file-only resolver.
jsonschema = { version = "0.46.8", default-features = false, features = ["resolve-file"] }
kamadak-exif = "0.6"
libc = "0.2"
regex = "1"
qrcode = { version = "0.14", default-features = false }
ring = "0.17"
ryu-js = "1.0.2"
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
sha2 = "0.10"
scrypt = { version = "0.12.0", features = ["phc"] }
subtle = "2"
tempfile = "3.23"
tokio = { version = "1.48", features = ["full"] }
tower-service = "0.3"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1.23.4", features = ["v4", "v7", "serde"] }
zeroize = "1.8"
snapback-types = { path = "../snapback-types" }
snapback-kernel = { path = "../snapback-kernel" }
snapback-auth = { path = "../snapback-auth" }
snapback-activation = { path = "../snapback-activation" }
snapback-runtime = { path = "../snapback-runtime" }
snapback-sync = { path = "../snapback-sync" }
snapback-services = { path = "../snapback-services", features = ["benchmark-support"] }
snapback-engine = { path = "../snapback-engine" }
snapback-server = { path = "../snapback-server", features = ["test-support"] }
snapback-cli = { path = "../snapback-cli" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[dev-dependencies]
snapback-auth = { path = "../snapback-auth", features = ["test-support"] }
snapback-engine = { path = "../snapback-engine", features = ["test-support"] }
snapback-kernel = { path = "../snapback-kernel", features = ["test-support"] }
snapback-runtime = { path = "../snapback-runtime", features = ["test-support"] }
snapback-sync = { path = "../snapback-sync", features = ["test-support"] }
snapback-services = { path = "../snapback-services", features = ["remainder-tests"] }
snapback-server = { path = "../snapback-server", features = ["test-support"] }
syn = { version = "2.0", features = ["full", "visit"] }
# test-util enables tokio's paused clock so the admitted-body ingest deadline
# (LLP 0058#admitted-body-ingestion) is testable without a 20-second wait.
tokio = { version = "1.48", features = ["full", "test-util"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
