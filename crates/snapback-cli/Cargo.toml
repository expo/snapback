[package]
name = "snapback-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
name = "snapback_cli"
path = "src/lib.rs"

[[bin]]
name = "snapback-local"
path = "src/bin/snapback-local.rs"
required-features = ["standalone-identity-provider"]

[features]
default = ["cli-owner", "standalone-identity-provider"]
# Stable feature name retained for affected-test selection after the CLI
# entrypoints moved here.
cli-owner = []
# The CLI package's own binary is a final composition target and must provide
# the stable identity/Guide symbols. The root `snapback` package disables this
# feature and supplies the same provider itself, so leaf changes do not become
# a Rust dependency edge into the CLI library unit.
standalone-identity-provider = ["dep:snapback-build-identity"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
http = "1"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
snapback-kernel = { path = "../snapback-kernel" }
snapback-build-identity = { path = "../snapback-build-identity", optional = true }
snapback-server = { path = "../snapback-server" }
snapback-services = { path = "../snapback-services" }
tokio = { version = "1.48", features = ["full"] }
ureq = { version = "2", features = ["json"] }
uuid = { version = "1.23.4", features = ["v4", "v7", "serde"] }
zeroize = "1.8"

[dev-dependencies]
snapback-kernel = { path = "../snapback-kernel", features = ["test-support"] }
snapback-services = { path = "../snapback-services", features = ["remainder-tests"] }
tempfile = "3.23"
tokio = { version = "1.48", features = ["full", "test-util"] }

[lints]
workspace = true
