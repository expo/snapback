[package]
name = "snapback-activation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "snapback_activation"
path = "src/lib.rs"

[features]
default = []
test-support = []

[dependencies]
anyhow = "1.0"
base64 = "0.22"
getrandom = { version = "0.3", features = ["std"] }
regex = "1"
ring = "0.17"
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
snapback-auth = { path = "../snapback-auth" }
snapback-kernel = { path = "../snapback-kernel" }
snapback-types = { path = "../snapback-types" }
unicode-normalization = "0.1"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.23"

[lints]
workspace = true
