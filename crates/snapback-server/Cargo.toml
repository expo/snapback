[package]
name = "snapback-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
name = "snapback_server"
path = "src/lib.rs"

[features]
default = ["server-owner"]
# Stable feature names retained for affected-test selection and owner-scoped
# test support after the transport sources moved here.
server-owner = []
benchmark-support = ["dep:tower"]
test-support = []

[dependencies]
anyhow = "1.0"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
fs2 = "0.4"
futures-util = "0.3"
getrandom = "0.3"
hmac = "0.12"
http-body = "1"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
regex = "1"
ring = "0.17"
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
sha2 = "0.10"
snapback-activation = { path = "../snapback-activation" }
snapback-auth = { path = "../snapback-auth" }
snapback-engine = { path = "../snapback-engine" }
snapback-kernel = { path = "../snapback-kernel" }
snapback-runtime = { path = "../snapback-runtime" }
snapback-services = { path = "../snapback-services" }
snapback-sync = { path = "../snapback-sync" }
snapback-types = { path = "../snapback-types" }
subtle = "2"
tokio = { version = "1.48", features = ["full"] }
tower = { version = "0.5", features = ["util"], optional = true }
tower-service = "0.3"
unicode-normalization = "0.1"
ureq = { version = "2", features = ["json"] }
url = "2.5"
uuid = { version = "1.23.4", features = ["v4", "v7", "serde"] }
zeroize = "1.8"

[dev-dependencies]
bcrypt = "0.19.3"
snapback-activation = { path = "../snapback-activation", features = ["test-support"] }
snapback-auth = { path = "../snapback-auth", features = ["test-support"] }
snapback-engine = { path = "../snapback-engine", features = ["test-support"] }
snapback-kernel = { path = "../snapback-kernel", features = ["test-support"] }
snapback-build-identity = { path = "../snapback-build-identity" }
snapback-runtime = { path = "../snapback-runtime", features = ["test-support"] }
snapback-services = { path = "../snapback-services", features = ["remainder-tests"] }
snapback-sync = { path = "../snapback-sync", features = ["test-support"] }
syn = { version = "2.0", features = ["full", "visit"] }
tempfile = "3.23"
tokio = { version = "1.48", features = ["full", "test-util"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
