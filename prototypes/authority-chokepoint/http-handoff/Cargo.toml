[package]
name = "authority-http-handoff-prototype"
version = "0.0.0"
edition = "2024"
publish = false

# This is a throwaway compiler probe, deliberately outside Snapback's real
# workspace and product dependency graph.
[workspace]

[features]
negative-direct-extension = []
negative-next-side-channel = []
negative-request-body-owner = []

[dependencies]
axum = "0.8.9"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
