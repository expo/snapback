name: qualified-package-staging

# @ref LLP 0041#nine-package-candidate-promotion--2026-07-28 — build both
# native runtimes independently at one clean revision, assemble one immutable
# full-closure candidate, then prove those exact tarballs on both platforms.

on:
  push:
    tags:
      - qualified-package-staging-*
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Exact semver to stage under the source-bound candidate tag
        required: true
        default: 0.1.1

defaults:
  image: sdk-57
  tools:
    node: 24.18.0
    bun: 1.3.12

jobs:
  linux_runtime:
    name: Build Linux runtime
    runs_on: linux-large
    steps:
      - uses: eas/checkout

      - name: Remove checkout authority and initialize public submodules
        run: |
          git remote set-url origin https://github.com/expo/snapback.git
          git submodule update --init --recursive
          scripts/check-checkout-credentials

      - uses: eas/install_node_modules

      - name: Restore Linux Hermes build/install cache
        uses: eas/restore_cache
        with:
          key: linux-hermes-${{ hashFiles('vendor/ibex/scripts/hermes-version.sh', 'vendor/ibex/scripts/apply-hermes-patches.sh', 'vendor/ibex/scripts/build-hermes-linux.sh', 'vendor/ibex/patches/hermes/*.patch', 'vendor/ibex/Cargo.toml') }}-${{ github.sha }}
          restore_keys: linux-hermes-${{ hashFiles('vendor/ibex/scripts/hermes-version.sh', 'vendor/ibex/scripts/apply-hermes-patches.sh', 'vendor/ibex/scripts/build-hermes-linux.sh', 'vendor/ibex/patches/hermes/*.patch', 'vendor/ibex/Cargo.toml') }}
          path: /home/expo/.cache/exact/hermes-linux

      - name: Build and attest the source-bound Linux runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.97.0
          export PATH="$HOME/.cargo/bin:$PATH"
          SNAPBACK_BOOTSTRAP_CHECK=0 scripts/bootstrap-ibex-runtime
          node scripts/runtime-link-smoke.mjs \
            --timeout-ms 900000 \
            --target-dir "$PWD/target" \
            --keep-target
          SNAPBACK_BUILD_DISTRIBUTION=public-package cargo build --release --bin snapback
          node packages/snapback-runtime-linux-x64/prepare-runtime.mjs
          test -f packages/snapback-runtime-linux-x64/lib/libhermesvm.so
          test -z "$(git status --porcelain --untracked-files=all)"

          artifact_root="$HOME/snapback-staging/linux"
          mkdir -p "$artifact_root"
          source_revision="$(git rev-parse HEAD)"
          packages/snapback-runtime-linux-x64/bin/snapback build-identity \
            > "$HOME/snapback-linux-build-identity.json"
          node scripts/snapback-create-runtime-artifact-attestation.mjs \
            --binary packages/snapback-runtime-linux-x64/bin/snapback \
            --hermes packages/snapback-runtime-linux-x64/lib/libhermesvm.so \
            --hermes-header packages/snapback-runtime-linux-x64/include/hermes/hermes.h.artifact \
            --identity "$HOME/snapback-linux-build-identity.json" \
            --source-revision "$source_revision" \
            --out "$artifact_root/build-attestation.json"
          cp packages/snapback-runtime-linux-x64/bin/snapback "$artifact_root/snapback"
          cp packages/snapback-runtime-linux-x64/lib/libhermesvm.so \
            "$artifact_root/libhermesvm.so"
          cp packages/snapback-runtime-linux-x64/include/hermes/hermes.h.artifact \
            "$artifact_root/hermes.h.artifact"
          mkdir -p "$HOME/.cache/exact/hermes-linux"
          mkdir -p .eas-artifacts
          tar -czf .eas-artifacts/snapback-linux-runtime.tar.gz \
            -C "$artifact_root" .

      - uses: eas/save_cache
        with:
          key: linux-hermes-${{ hashFiles('vendor/ibex/scripts/hermes-version.sh', 'vendor/ibex/scripts/apply-hermes-patches.sh', 'vendor/ibex/scripts/build-hermes-linux.sh', 'vendor/ibex/patches/hermes/*.patch', 'vendor/ibex/Cargo.toml') }}-${{ github.sha }}
          path: /home/expo/.cache/exact/hermes-linux

      - uses: eas/upload_artifact
        with:
          type: other
          name: snapback-linux-runtime
          path: .eas-artifacts/snapback-linux-runtime.tar.gz

  darwin_runtime:
    name: Build macOS runtime
    runs_on: macos-large
    steps:
      - uses: eas/checkout

      - name: Remove checkout authority and initialize public submodules
        run: |
          git remote set-url origin https://github.com/expo/snapback.git
          git submodule update --init --recursive
          scripts/check-checkout-credentials

      - uses: eas/install_node_modules

      - name: Restore macOS Hermes build/install cache
        uses: eas/restore_cache
        with:
          key: darwin-hermes-${{ hashFiles('vendor/ibex/scripts/hermes-version.sh', 'vendor/ibex/scripts/apply-hermes-patches.sh', 'vendor/ibex/scripts/build-hermes.sh', 'vendor/ibex/patches/hermes/*.patch', 'vendor/ibex/Cargo.toml') }}-${{ github.sha }}
          restore_keys: darwin-hermes-${{ hashFiles('vendor/ibex/scripts/hermes-version.sh', 'vendor/ibex/scripts/apply-hermes-patches.sh', 'vendor/ibex/scripts/build-hermes.sh', 'vendor/ibex/patches/hermes/*.patch', 'vendor/ibex/Cargo.toml') }}
          path: /Users/expo/.cache/exact/hermes

      - name: Build the source-bound macOS runtime
        run: |
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.97.0
          export PATH="$HOME/.cargo/bin:$PATH"
          SNAPBACK_BOOTSTRAP_CHECK=0 scripts/bootstrap-ibex-runtime
          node scripts/runtime-link-smoke.mjs \
            --timeout-ms 900000 \
            --target-dir "$PWD/target" \
            --keep-target
          SNAPBACK_BUILD_DISTRIBUTION=public-package cargo build --release --bin snapback
          node packages/snapback-runtime-darwin-arm64/prepare-runtime.mjs
          packages/snapback-runtime-darwin-arm64/bin/snapback build-identity
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p .eas-artifacts
          tar -czf .eas-artifacts/snapback-darwin-runtime.tar.gz \
            -C packages/snapback-runtime-darwin-arm64 \
            bin Frameworks include runtime-readiness.json

      - uses: eas/save_cache
        with:
          key: darwin-hermes-${{ hashFiles('vendor/ibex/scripts/hermes-version.sh', 'vendor/ibex/scripts/apply-hermes-patches.sh', 'vendor/ibex/scripts/build-hermes.sh', 'vendor/ibex/patches/hermes/*.patch', 'vendor/ibex/Cargo.toml') }}-${{ github.sha }}
          path: /Users/expo/.cache/exact/hermes

      - uses: eas/upload_artifact
        with:
          type: other
          name: snapback-darwin-runtime
          path: .eas-artifacts/snapback-darwin-runtime.tar.gz

  assemble:
    name: Assemble qualified closure
    needs: [linux_runtime, darwin_runtime]
    runs_on: macos-medium
    steps:
      - uses: eas/checkout

      - name: Remove checkout authority
        run: |
          git remote set-url origin https://github.com/expo/snapback.git
          scripts/check-checkout-credentials

      - uses: eas/install_node_modules

      - id: linux_artifact
        uses: eas/download_artifact
        with:
          name: snapback-linux-runtime

      - id: darwin_artifact
        uses: eas/download_artifact
        with:
          name: snapback-darwin-runtime

      - name: Bind, assemble, and dry-run the exact public closure
        run: |
          source_revision="$(git rev-parse HEAD)"
          RELEASE_VERSION=${{ inputs.version || '0.1.1' }}
          export RELEASE_VERSION
          node -e '
            const version = process.env.RELEASE_VERSION;
            if (!/^[0-9]+[.][0-9]+[.][0-9]+$/.test(version)) {
              throw new Error("this workflow requires an exact stable semver");
            }
          '
          artifact_root="$HOME/snapback-staging"
          mkdir -p "$artifact_root/linux" "$artifact_root/darwin"
          mkdir -p .eas-artifacts
          linux_runtime=${{ steps.linux_artifact.outputs.artifact_path }}
          darwin_runtime=${{ steps.darwin_artifact.outputs.artifact_path }}
          test -d "$linux_runtime"
          test -d "$darwin_runtime"
          cp -R "$linux_runtime/." "$artifact_root/linux/"
          cp -R "$darwin_runtime/." "$artifact_root/darwin/"

          darwin_identity="$($artifact_root/darwin/bin/snapback build-identity)"
          DARWIN_IDENTITY="$darwin_identity" SOURCE_REVISION="$source_revision" node -e '
            const identity = JSON.parse(process.env.DARWIN_IDENTITY);
            if (identity?.binary?.gitCommit !== process.env.SOURCE_REVISION
                || identity.binary.gitDirty !== false
                || identity.binary.buildProfile !== "release"
                || identity.buildDistribution !== "public-package") {
              throw new Error("transported macOS runtime identity drifted");
            }
          '

          candidate_tag="bakeoff-${RELEASE_VERSION//./-}-${source_revision:0:12}"
          export SNAPBACK_PACKAGE_OUT="$HOME/snapback-qualified"
          export SNAPBACK_RUNTIME_SOURCE_BINARY="$artifact_root/darwin/bin/snapback"
          export SNAPBACK_RUNTIME_HERMES_FRAMEWORK="$artifact_root/darwin/Frameworks/hermesvm.framework"
          export SNAPBACK_RUNTIME_HERMES_HEADER="$artifact_root/darwin/include/hermes/hermes.h.artifact"
          export SNAPBACK_RUNTIME_LINUX_X64_SOURCE_BINARY="$artifact_root/linux/snapback"
          export SNAPBACK_RUNTIME_LINUX_X64_HERMES_LIBRARY="$artifact_root/linux/libhermesvm.so"
          export SNAPBACK_RUNTIME_LINUX_X64_HERMES_HEADER="$artifact_root/linux/hermes.h.artifact"
          export SNAPBACK_RUNTIME_LINUX_X64_BUILD_ATTESTATION="$artifact_root/linux/build-attestation.json"
          export SNAPBACK_RUNTIME_LINUX_X64_SOURCE_REVISION="$source_revision"
          node scripts/snapback-publish.mjs \
            --scope-preset identity \
            --runtime-platforms all \
            --version "$RELEASE_VERSION" \
            --tag "$candidate_tag" \
            --out "$SNAPBACK_PACKAGE_OUT"
          SOURCE_REVISION="$source_revision" CANDIDATE_TAG="$candidate_tag" \
            node scripts/qualified-staging-ledger-check.mjs
          test -z "$(git status --porcelain --untracked-files=all)"
          tar -czf .eas-artifacts/snapback-qualified-tarballs.tar.gz \
            -C "$SNAPBACK_PACKAGE_OUT" .

      - uses: eas/upload_artifact
        with:
          type: other
          name: snapback-qualified-tarballs
          path: .eas-artifacts/snapback-qualified-tarballs.tar.gz

  darwin_staged_proof:
    name: Prove macOS staged closure
    needs: [assemble]
    runs_on: macos-medium
    env:
      RUNNER_ENVIRONMENT: eas-hosted
      SNAPBACK_EAS_WORKFLOW_FILENAME: ${{ workflow.filename }}
      SNAPBACK_EAS_WORKFLOW_RUN_ID: ${{ workflow.id }}
    steps:
      - uses: eas/checkout

      - name: Remove checkout authority
        run: |
          git remote set-url origin https://github.com/expo/snapback.git
          scripts/check-checkout-credentials

      - id: qualified_artifact
        uses: eas/download_artifact
        with:
          name: snapback-qualified-tarballs

      - run: |
          qualified_root="$HOME/snapback-qualified"
          receipt=".eas-artifacts/snapback-darwin-arm64-staged-receipt.json"
          mkdir -p .eas-artifacts "$qualified_root"
          qualified_artifact=${{ steps.qualified_artifact.outputs.artifact_path }}
          cp -R "$qualified_artifact/." "$qualified_root/"
          node scripts/snapback-package-cold-install.mjs \
            --ledger "$qualified_root/publish-ledger.json" \
            --install-source staged \
            --root-selector exact \
            --receipt "$receipt"

      - uses: eas/upload_artifact
        with:
          type: other
          name: snapback-darwin-arm64-staged-receipt
          path: .eas-artifacts/snapback-darwin-arm64-staged-receipt.json

  linux_staged_proof:
    name: Prove Linux staged closure
    needs: [assemble]
    runs_on: linux-medium
    env:
      RUNNER_ENVIRONMENT: eas-hosted
      SNAPBACK_EAS_WORKFLOW_FILENAME: ${{ workflow.filename }}
      SNAPBACK_EAS_WORKFLOW_RUN_ID: ${{ workflow.id }}
    steps:
      - uses: eas/checkout

      - name: Remove checkout authority
        run: |
          git remote set-url origin https://github.com/expo/snapback.git
          scripts/check-checkout-credentials

      - id: qualified_artifact
        uses: eas/download_artifact
        with:
          name: snapback-qualified-tarballs

      - run: npx --yes playwright@1.62.0 install-deps chromium

      - run: |
          qualified_root="$HOME/snapback-qualified"
          receipt=".eas-artifacts/snapback-linux-x64-staged-receipt.json"
          mkdir -p .eas-artifacts "$qualified_root"
          qualified_artifact=${{ steps.qualified_artifact.outputs.artifact_path }}
          cp -R "$qualified_artifact/." "$qualified_root/"
          node scripts/snapback-package-cold-install.mjs \
            --ledger "$qualified_root/publish-ledger.json" \
            --install-source staged \
            --root-selector exact \
            --receipt "$receipt"

      - uses: eas/upload_artifact
        with:
          type: other
          name: snapback-linux-x64-staged-receipt
          path: .eas-artifacts/snapback-linux-x64-staged-receipt.json

  qualified_release:
    name: Retain qualified release
    needs: [darwin_staged_proof, linux_staged_proof]
    runs_on: linux-medium
    steps:
      - id: qualified_artifact
        uses: eas/download_artifact
        with:
          name: snapback-qualified-tarballs

      - id: darwin_receipt
        uses: eas/download_artifact
        with:
          name: snapback-darwin-arm64-staged-receipt

      - id: linux_receipt
        uses: eas/download_artifact
        with:
          name: snapback-linux-x64-staged-receipt

      - name: Require the complete retained qualification
        run: |
          release_root="$HOME/qualified-release"
          mkdir -p "$release_root/receipts"
          qualified_artifact=${{ steps.qualified_artifact.outputs.artifact_path }}
          darwin_receipt=${{ steps.darwin_receipt.outputs.artifact_path }}
          linux_receipt=${{ steps.linux_receipt.outputs.artifact_path }}
          test -d "$qualified_artifact"
          test -f "$darwin_receipt"
          test -f "$linux_receipt"
          cp -R "$qualified_artifact/." "$release_root/"
          cp "$darwin_receipt" \
            "$release_root/receipts/snapback-darwin-arm64-staged-receipt.json"
          cp "$linux_receipt" \
            "$release_root/receipts/snapback-linux-x64-staged-receipt.json"
          test -f "$release_root/publish-ledger.json"
          test -f "$release_root/receipts/snapback-darwin-arm64-staged-receipt.json"
          test -f "$release_root/receipts/snapback-linux-x64-staged-receipt.json"
          expected_package_count=$(node --input-type=module -e '
            import { PACKAGE_INVENTORY } from "./scripts/snapback-publish-core.mjs";
            process.stdout.write(String(PACKAGE_INVENTORY.length));
          ')
          test "$(find "$release_root" -maxdepth 1 -name '*.tgz' | wc -l | tr -d ' ')" = "$expected_package_count"
          mkdir -p .eas-artifacts
          tar -czf .eas-artifacts/snapback-qualified-release.tar.gz \
            -C "$release_root" .

      - uses: eas/upload_artifact
        with:
          type: other
          name: snapback-qualified-release
          path: .eas-artifacts/snapback-qualified-release.tar.gz
