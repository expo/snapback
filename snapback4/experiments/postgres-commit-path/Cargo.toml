[package]
name = "snapback4-postgres-commit-path"
version = "0.1.0"
edition = "2024"
publish = false

# Deliberately outside the normal CLI/device publication workspace, like
# ../postgres. RT5 shares a core test-only codec; serving is unchanged.
[workspace]

[features]
# RT5 uses the same binary/timer while historical SQLite raw-handle cells await
# port adaptation. No production feature or raw-handle escape is added.
rt5 = []

[dependencies]
snapback4-core = { path = "../../crates/snapback4-core", default-features = false, features = ["postgres"] }
snapback4-postgres-evaluation = { path = "../postgres" }
postgres = "0.19.14"
serde_json = "1"
libc = "0.2"
rusqlite = "0.40.2"
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
tokio-postgres = "0.7"

[profile.release]
debug = 1
