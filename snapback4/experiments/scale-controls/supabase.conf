# Supabase docker-compose at 5491fb60bc0f27b8909a83100d79499aa7667ee5
# pins PostgREST 14.18. Secrets and database URI supplied through environment.
db-schemas = "sb4scale"
db-extra-search-path = "public"
db-anon-role = "anon"
db-max-rows = 1000
db-pool = 10
db-pool-acquisition-timeout = 10
db-pool-max-lifetime = 1800
db-pool-max-idletime = 30
db-pool-automatic-recovery = true
db-prepared-statements = true
db-config = true
db-channel = "pgrst"
db-channel-enabled = true
# No db-pre-request or db-pre-config: neither is set by the official stack.
db-tx-end = "commit"
jwt-role-claim-key = ".role"
jwt-secret-is-base64 = false
jwt-cache-max-entries = 1000
app.settings.jwt_exp = "3600"
server-host = "127.0.0.1"
server-port = 58080
admin-server-host = "127.0.0.1"
admin-server-port = 58082
log-level = "error"
log-query = false
openapi-mode = "follow-privileges"
server-timing-enabled = false
