[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/snapback4"]
exclude = ["vendor/tiny_http"]

[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }

[workspace.package]
version = "0.1.17"
edition = "2024"
license = "MIT"

# The ordinary loop: incremental release builds so an edit re-links, not rebuilds.
[profile.release]
incremental = true

# The device core as wasm: size first.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
strip = true

# The shipped bytes. Small, stripped, one codegen unit.
[profile.production]
inherits = "release"
incremental = false
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
