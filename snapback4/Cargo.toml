[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/snapback4"]
exclude = ["vendor/tiny_http"]

[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }

[workspace.package]
version = "0.4.24"
edition = "2024"
license = "MIT"

# The ordinary loop: incremental release builds so an edit re-links, not rebuilds.
[profile.release]
incremental = true

# Scale fixtures exercise the same debug assertions over production-sized
# populations. Optimize their code without disabling those assertions so the
# complete warm blocking suite keeps its 60-second contract.
[profile.test]
opt-level = 1

# Device scale fixtures spend most of their time in the device crate itself.
[profile.test.package."snapback4-device"]
opt-level = 3

# The device core as wasm: size first.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
strip = true

# The shipped server: throughput first, stripped, one codegen unit.
# @ref LLP 3000#7-decisions-during-execution — measured production compiler trade
[profile.production]
inherits = "release"
incremental = false
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
