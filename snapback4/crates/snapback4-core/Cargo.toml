[package]
name = "snapback4-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Snapback 4 core: the value model, schema, IR, SQLite store, rules, the runtime meter, the interpreter, and the partition log (LLP 3000 §5 week 2)."

[features]
# Debug-only raw fixture/corruption hooks; consumers enable this only in dev-dependencies.
test-support = ["sqlite", "rusqlite/trace", "rusqlite/preupdate_hook"]
# Typed standalone evaluator operations; never exports raw fixture handles.
evaluation-support = ["sqlite"]
default = ["sqlite", "native", "server-search"]
# Compact one-read membership opening belongs to server reads, not device wasm.
server-search = []
# The wasm host (LLP 3000.005): the app's module run over any `Rows` — a
# native read on a device, or on the server.
wasm-host = ["dep:wasmi"]
# Native jobs: the module run by the engine's job runner, one chunk per commit.
native = ["sqlite", "wasm-host"]
# The server: the SQLite store, identity, the asset ledger, jobs, the log.
# Without it the crate is the interpreter over the `Rows` trait, for a
# device that brings its own store (wasm on the web, or a host's SQLite).
sqlite = ["dep:rusqlite", "dep:argon2", "dep:rayon"]
# Server adapter selected by the public CLI and retained evaluation oracle.
# Device and no-default core builds do not link it.
postgres = ["sqlite", "dep:postgres", "dep:tokio-postgres", "dep:tokio", "dep:futures-util", "dep:rustix"]
# The browser device mints additional prediction ids through Web Crypto.
web = ["getrandom/wasm_js", "dep:js-sys"]
# Exercise the web-only engine choices in native device differentials.
web-device-check = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
rusqlite = { version = "0.41.1", features = ["bundled", "backup", "hooks"], optional = true }
argon2 = { version = "0.5", optional = true }
getrandom = "0.3"
postgres = { version = "0.19.14", optional = true }
tokio-postgres = { version = "=0.7.18", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
wasmi = { version = "2.0.0", default-features = false, features = ["stable", "std", "validate", "auto-dispatch", "deterministic"], optional = true }

# Native Rust callers can pass prebuilt trees beyond the text parser's limit.
# The web only receives text; keep this parser option out of its artifact.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { version = "1.11", optional = true }
serde_json = { version = "1", features = ["unbounded_depth", "raw_value"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
snapback4-core = { path = ".", default-features = false, features = ["test-support", "evaluation-support"] }
rusqlite = { version = "0.41.1", features = ["hooks"] }
snapback4-lang = { path = "../snapback4-lang" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "=0.3.104", optional = true }

# `cfg(kani)` gates the key-encoding proofs (`src/key_proofs.rs`, `scripts/kani.sh`).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[[example]]
name = "adoption_pause"
required-features = ["test-support"]

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["time"], optional = true }
