[package]
name = "snapback4-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Snapback 4 core: the value model, schema, IR, SQLite store, rules, the runtime meter, the interpreter, and the partition log (LLP 3000 §5 week 2)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
