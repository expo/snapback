[package]
name = "snapback4-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Snapback 4 core: the value model, schema, IR, SQLite store, rules, the runtime meter, the interpreter, and the partition log (LLP 3000 §5 week 2)."

[features]
default = ["sqlite", "native"]
# The wasm host (LLP 3000.005): the app's module run over any `Rows` — a
# native read on a device, or on the server.
wasm-host = ["dep:wasmi"]
# Native jobs: the module run by the engine's job runner, one chunk per commit.
native = ["sqlite", "wasm-host"]
# The server: the SQLite store, identity, the asset ledger, jobs, the log.
# Without it the crate is the interpreter over the `Rows` trait, for a
# device that brings its own store (wasm on the web, or a host's SQLite).
sqlite = ["dep:rusqlite", "dep:argon2"]
# Evaluation-only server adapter; not linked into the CLI or device builds.
postgres = ["sqlite", "dep:postgres"]
# The browser device mints additional prediction ids through Web Crypto.
web = ["getrandom/wasm_js", "dep:js-sys"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
argon2 = { version = "0.5", optional = true }
getrandom = "0.3"
postgres = { version = "0.19.14", optional = true }
wasmi = { version = "2.0.0", default-features = false, features = ["stable", "std", "validate", "auto-dispatch", "deterministic"], optional = true }

# Native Rust callers can pass prebuilt trees beyond the text parser's limit.
# The web only receives text; keep this parser option out of its artifact.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = { version = "1", features = ["unbounded_depth"] }

[dev-dependencies]
snapback4-lang = { path = "../snapback4-lang" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "=0.3.104", optional = true }
