[package]
name = "snapback4-lang"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Quarry for Snapback 4: lexer, parser, binder to the core IR, diagnostics with rewrites, and the client type emitter."

[dependencies]
snapback4-core = { path = "../snapback4-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"
