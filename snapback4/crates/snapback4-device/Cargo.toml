[package]
name = "snapback4-device"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Snapback 4 on a device: one implementation of the device — the partition held, the stream applied, the outbox kept, queries and predictions answered — over the core's SQLite on a native host (`native`, with a C ABI) or over memory as wasm on the web (`web`)."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["native"]
native = ["snapback4-core/sqlite", "dep:rusqlite"]
web = ["dep:wasm-bindgen"]

[dependencies]
snapback4-core = { path = "../snapback4-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "=0.2.127", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }

[dev-dependencies]
snapback4-lang = { path = "../snapback4-lang" }
