[package]
name = "snapback4-device"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Snapback 4 on a device: the core's interpreter over the host's store — the native module for Expo and Exact2 hosts (`native`: the core's own SQLite, the stream applied, the outbox kept, a C ABI), or wasm over a web host's callbacks (`web`, for measurement)."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["native"]
native = ["snapback4-core/sqlite", "dep:rusqlite"]
web = ["dep:wasm-bindgen"]

[dependencies]
snapback4-core = { path = "../snapback4-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "=0.2.127", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[dev-dependencies]
snapback4-lang = { path = "../snapback4-lang" }
