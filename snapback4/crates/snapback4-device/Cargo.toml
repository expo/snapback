[package]
name = "snapback4-device"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Snapback 4 on a device: the core's interpreter over the host's store, as wasm for the web (this crate) and as a native library over the core's own SQLite for Expo and Exact hosts."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
snapback4-core = { path = "../snapback4-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.127"
