[package]
name = "snapback4"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Snapback 4 — the binary: check, dev, run, test, why, guide, doctor, init."

[dependencies]
libc = "0.2"
sha2 = "0.10"
hmac = "0.12"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
snapback4-core = { path = "../snapback4-core" }
snapback4-lang = { path = "../snapback4-lang" }
snapback4-device = { path = "../snapback4-device" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "=0.8.23"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
tiny_http = "0.12"
sqlparser = { version = "0.59.0", default-features = false, features = ["std"] }

# Only CLI preflight links this parser. Update the exact pin with the device-gate
# syntax regressions; 0.154.0 matches this workspace's Rust 1.97 toolchain.
oxc_allocator = "=0.154.0"
oxc_ast = "=0.154.0"
oxc_ast_visit = "=0.154.0"
oxc_parser = { version = "=0.154.0", default-features = false }
oxc_span = "=0.154.0"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["trace"] }
