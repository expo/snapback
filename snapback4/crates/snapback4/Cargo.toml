[package]
name = "snapback4"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Snapback 4 — the binary: check, dev, run, test, why, guide, doctor, init."

[dependencies]
libc = "0.2"
sha2 = "0.10"
snapback4-core = { path = "../snapback4-core" }
snapback4-lang = { path = "../snapback4-lang" }
snapback4-device = { path = "../snapback4-device" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
tiny_http = "0.12"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["trace"] }
