[package]
name = "snapback4-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Deterministic simulation for Snapback 4: one program under a seed — virtual clock, scheduler, faulty network, faulty disks, kill and restart — hosting the real server core and a replica client."

[dependencies]
snapback4-core = { path = "../snapback4-core" }
snapback4-lang = { path = "../snapback4-lang" }
serde_json = "1"
