name: public-package-proof
run-name: public-package-proof-${{ inputs.operation_id || 'manual' }}

# @ref LLP 0041#acceptance — install the exact public package closure on a
# new GitHub-hosted macOS/arm64 VM and a self-hosted expo Linux/x64 runner,
# then aggregate both receipts.
# @ref LLP 0063#workstream-6--reduce-snapbacks-declaration-and-runtime-tax —
# the public-registry claim remains red unless every promised runtime tuple
# agrees with one successful immutable publication ledger.

on:
  workflow_dispatch:
    inputs:
      ledger_path:
        description: Committed successful publication ledger
        required: true
        default: demos/partiful-matrix/acceptance/evidence/step5-package-publication.json
      root_selector:
        description: Exact package aliases or the promoted latest CLI root
        required: true
        default: exact
        type: choice
        options:
          - exact
          - latest
      operation_id:
        description: Correlation identity for bounded promotion-time proof collection
        required: true
        default: manual
      expected_prior_root_version:
        description: Lease-bound prior CLI version eligible for latest-only retry
        required: false
        default: ''
      authorized_lease_sha256:
        description: Lease digest authorizing the latest-only retry
        required: false
        default: ''
      publication_epoch:
        description: Publication epoch authorizing the latest-only retry
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: public-package-proof-${{ github.ref }}-${{ inputs.operation_id || 'manual' }}
  cancel-in-progress: false

jobs:
  platform-proof:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: darwin-arm64
            runner: macos-15-xlarge
          - id: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Preserve and validate the publication ledger
        id: ledger
        env:
          LEDGER_PATH: ${{ inputs.ledger_path }}
        run: |
          node -e '
            const fs = require("node:fs");
            const path = process.env.LEDGER_PATH;
            const ledger = JSON.parse(fs.readFileSync(path, "utf8"));
            if (!["snapback.package-publication.v1", "snapback.package-candidate-ledger.v1"]
                  .includes(ledger.schemaVersion)
                || ledger.mode !== "publish"
                || ledger.sourceDirty !== false
                || !/^[0-9a-f]{40}$/.test(ledger.revision)) {
              throw new Error("publication ledger is not an eligible immutable source");
            }
            fs.copyFileSync(path, process.env.RUNNER_TEMP + "/snapback-publication-ledger.json");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "revision=" + ledger.revision + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "version=" + ledger.version + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "scope_preset=" + ledger.scopePreset + "\n");
          '

      - name: Materialize the immutable package-source checkout
        env:
          SOURCE_REVISION: ${{ steps.ledger.outputs.revision }}
        run: |
          git worktree add --detach \
            "$RUNNER_TEMP/snapback-package-source" \
            "$SOURCE_REVISION"

      - name: Verify checkout credential cleanup
        run: |
          scripts/check-checkout-credentials
          (
            cd "$RUNNER_TEMP/snapback-package-source"
            "$GITHUB_WORKSPACE/scripts/check-checkout-credentials"
          )

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ steps.ledger.outputs.scope_preset != 'ccheever' }}
        with:
          bun-version-file: package.json

      - name: Install repository dependencies
        if: ${{ steps.ledger.outputs.scope_preset != 'ccheever' }}
        run: bun install --frozen-lockfile

      - name: Prove the nested Expo client and React registry closure
        if: ${{ steps.ledger.outputs.scope_preset != 'ccheever' }}
        env:
          SNAPBACK_PUBLISHED_CLOSURE_VERSION: ${{ steps.ledger.outputs.version }}
        run: node --test scripts/published-closure-rehearsal.test.mjs

      - name: Prove the public package loop
        env:
          RECEIPT_PATH: ${{ runner.temp }}/snapback-${{ matrix.id }}-public-package-receipt.json
          SNAPBACK_PROOF_OPERATION_ID: ${{ inputs.operation_id }}
          ROOT_SELECTOR: ${{ inputs.root_selector }}
          EXPECTED_PRIOR_ROOT_VERSION: ${{ inputs.expected_prior_root_version }}
          AUTHORIZED_LEASE_SHA256: ${{ inputs.authorized_lease_sha256 }}
          PUBLICATION_EPOCH: ${{ inputs.publication_epoch }}
        run: |
          authority_args=()
          if [[ "$ROOT_SELECTOR" == latest ]]; then
            [[ "$EXPECTED_PRIOR_ROOT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            [[ "$AUTHORIZED_LEASE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$PUBLICATION_EPOCH" =~ ^[1-9][0-9]*$ ]]
            authority_args=(
              --expected-prior-root-version "$EXPECTED_PRIOR_ROOT_VERSION"
              --authorized-lease-sha256 "$AUTHORIZED_LEASE_SHA256"
              --publication-epoch "$PUBLICATION_EPOCH"
            )
          else
            [[ -z "$EXPECTED_PRIOR_ROOT_VERSION" ]]
            [[ -z "$AUTHORIZED_LEASE_SHA256" ]]
            [[ -z "$PUBLICATION_EPOCH" ]]
          fi
          node scripts/snapback-package-cold-install.mjs \
            --ledger "$RUNNER_TEMP/snapback-publication-ledger.json" \
            --install-source public \
            --root-selector "$ROOT_SELECTOR" \
            --source-checkout "$RUNNER_TEMP/snapback-package-source" \
            --proof-harness-revision "${{ github.sha }}" \
            "${authority_args[@]}" \
            --receipt "$RECEIPT_PATH"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapback-${{ matrix.id }}-${{ inputs.root_selector }}-public-package-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/snapback-${{ matrix.id }}-public-package-receipt.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: ${{ inputs.root_selector == 'exact' }}
    needs: platform-proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify checkout credential cleanup
        run: scripts/check-checkout-credentials

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Preserve the committed publication ledger for aggregation
        env:
          LEDGER_PATH: ${{ inputs.ledger_path }}
        run: cp "$LEDGER_PATH" "$RUNNER_TEMP/snapback-publication-ledger.json"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: snapback-*-exact-public-package-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/platform-receipts
          merge-multiple: true

      - name: Aggregate the complete public runtime matrix
        env:
          LEDGER_PATH: ${{ runner.temp }}/snapback-publication-ledger.json
          RECEIPT_PATH: ${{ runner.temp }}/step5-packaged-loop.json
        run: |
          node scripts/snapback-package-proof-aggregate.mjs \
            --ledger "$LEDGER_PATH" \
            --platform-receipt "$RUNNER_TEMP/platform-receipts/snapback-darwin-arm64-public-package-receipt.json" \
            --platform-receipt "$RUNNER_TEMP/platform-receipts/snapback-linux-x64-public-package-receipt.json" \
            --receipt "$RECEIPT_PATH"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapback-step5-packaged-loop-${{ github.sha }}
          path: ${{ runner.temp }}/step5-packaged-loop.json
          if-no-files-found: error
          retention-days: 30
