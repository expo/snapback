name: required-surface-builds

# ENG-22543 (Diary 0011 flip-condition 2; Exact LLP 0286 cadence run #3): the
# required cursors-web Contract surface was DEV-GREEN, SHIP-BROKEN on the pin —
# it had never been production-built, so a `vite build` regression shipped
# silently behind a green dev loop. This lane production-builds EVERY REQUIRED
# demo web surface (derived from demos/*/demo.snapback.json), so a package or
# lockfile bump that breaks a required build can be caught before shipping.
# scripts/check-required-surface-builds.mjs is the canonical gate;
# verify-local-proof runs the same script, so local runs and explicit CI
# qualification exercise one code path.
#
# This is the CORE lane (LLP 0015 §Peer Checkout Versus Submodule): every
# surface installs @exact/* from npm and bun.lock is the pin. ENG-22564 removed
# the Exact checkout/native-asset bridge; this job proves a clean Snapback
# checkout can install and build without sibling source state.
#
# @ref LLP 0189#temporary-low-noise-development-posture-2026-08-24 — retain
# this heavyweight proof for explicit qualification while its baseline is red.
# LLP 0316 Phase 6 precondition 3 is proved independently of activation:
# scripts/required-surface-build-paths.v1.json is the eventual ordered `paths`
# authority, validated against the manifest-derived required surface inventory
# by scripts/check-required-surface-builds.mjs and
# tests/required_surface_builds_v0.mjs. Do not add `push` without LLP 0189's
# separate author-direction precondition.

on:
  workflow_dispatch:

permissions:
  contents: read

# Coalesce repeated manual qualification requests for the same ref.
concurrency:
  group: required-surface-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-surface-builds:
    runs-on: expo-large
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify checkout credentials were removed
        run: scripts/check-checkout-credentials

      # ENG-24513: consume the root .node-version authority instead of
      # floating the Node patch release.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # Build-only gate: no engine, no submodules, no Hermes — just the web
      # production builds of every required surface. The script performs one
      # frozen root-workspace install for local Snapback package edges,
      # materializes each gated demo's gitignored codegen graph from its
      # committed review manifest (refusing manifest drift — the surface
      # builds verify the digest-keyed graph fail-closed, so a clean checkout
      # must regenerate it first), then each registry surface's own frozen
      # install for its Exact pin; a lockfile that drifts fails, not resolves.
      - name: Production-build every required demo web surface
        run: node scripts/check-required-surface-builds.mjs

      # ENG-24452: the rebuild above regenerates dist trees in place; reject
      # absolute checkout paths in the production bytes (pre-0.1.5 portable-
      # artifact pins are reported and skipped until the regen lands).
      - name: Reject absolute checkout paths in production artifacts
        run: node scripts/check-artifact-path-hygiene.mjs
