name: all-aboard-cold-clone

# ENG-22480 (Diary 0010): prove cold-clone reproducibility of the All Aboard
# Contract surface — `bun install --frozen-lockfile` in the surface resolves
# the published Exact packages from the npm registry at exactly the versions
# the committed bun.lock records (the lockfile replaced exact.pin.json),
# production build, then the full 34-check browser acceptance where missing
# Exact packages are a FAILURE (SNAPBACK_REQUIRE_EXACT=1), never a skip.
# scripts/cold-clone-check.sh is the canonical check; this job runs it
# unmodified on a runner with no sibling checkouts by construction.
#
# @ref LLP 0189#temporary-low-noise-development-posture-2026-08-24 — keep
# heavyweight cold-clone qualification manual while main is landing in bursts.
#
on:
  workflow_dispatch:

permissions:
  contents: read

# Coalesce repeated manual qualification requests for the same ref.
concurrency:
  group: all-aboard-cold-clone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-clone:
    runs-on: expo-large
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false
          # vendor/ibex is a private-repo submodule; the default GITHUB_TOKEN
          # only reads this repository. Fine-grained PAT, Contents: read on
          # ccheever/snapback + ccheever/ibex. (ENG-22480 phase 2: the extra
          # Contents: read grant on ccheever/exact is no longer needed — the
          # Exact side of this lane installs from the public npm registry.)

      - name: Verify checkout credentials were removed
        run: scripts/check-checkout-credentials

      # ENG-24513: consume the root .node-version authority instead of
      # floating the Node patch release.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev

      - name: Cache Hermes Linux build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/exact/hermes-linux
            vendor/ibex/linux
            vendor/ibex/tools/hermes
          # Match the canonical local-proof identity exactly. The cold-clone
          # browser exercises action runtimes too, so restoring Hermes from a
          # different pin or patch stack can make its JS/Rust checkout disagree
          # with the native engine under test.
          key: ${{ runner.os }}-hermes-${{ hashFiles('vendor/ibex/scripts/hermes-version.sh', 'vendor/ibex/scripts/apply-hermes-patches.sh', 'vendor/ibex/scripts/build-hermes-linux.sh', 'vendor/ibex/patches/hermes/*.patch', 'vendor/ibex/Cargo.toml') }}

      # The self-hosted expo image ships no Rust toolchain (cargo ENOENT),
      # unlike GitHub's ubuntu-latest. Install rustup bare, then let
      # rust-toolchain.toml select the reviewed compiler authority.
      - name: Install the pinned Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install
          rustup show active-toolchain

      # Cargo registry + target cache: without it every run cold-compiles the
      # full dependency tree (and the ibex-runtime C++ glue) — the dominant
      # per-run cost.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # scripts/cold-clone-check.sh refuses to run without a Chrome/Chromium
      # binary on PATH. GitHub's ubuntu-latest image shipped Chrome; the
      # self-hosted expo-large image is not guaranteed to, so install the
      # stable Chrome deb only when no candidate binary is already present.
      - name: Ensure a Chrome binary for the browser acceptance
        run: |
          for candidate in google-chrome google-chrome-stable chromium-browser chromium; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "[snapback-ci] browser acceptance will use $candidate"
              exit 0
            fi
          done
          curl -fsSL -o "$RUNNER_TEMP/google-chrome-stable.deb" \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y "$RUNNER_TEMP/google-chrome-stable.deb"

      # Step 1 (registry install + production build) and step 2 (the 34-check
      # browser acceptance) both live in the script so local runs and CI
      # exercise one code path. No continue-on-error, no fallback: if the
      # install, the build, or any check fails, this job is red.
      - name: Cold-clone check (registry install + build + browser acceptance)
        # GitHub's shared two-core runner varied materially while Vite cold-
        # transforms the registry graph. Keep the 2200 ms default/local gate
        # and its 2600 ms synthetic regression strict; this lane alone uses
        # 1.5x headroom over the observed 2507 ms CI maximum (ENG-24386).
        env:
          ALL_ABOARD_PAINT_BUDGET_MS: "3800"
        run: scripts/cold-clone-check.sh
