name: all-aboard-cold-clone

# ENG-22480 (Diary 0010): prove cold-clone reproducibility of the All Aboard
# Contract surface — `bun install --frozen-lockfile` in the surface resolves
# the published Exact packages from the npm registry at exactly the versions
# the committed bun.lock records (the lockfile replaced exact.pin.json),
# production build, then the full 14-check browser acceptance where missing
# Exact packages are a FAILURE (SNAPBACK_REQUIRE_EXACT=1), never a skip.
# scripts/cold-clone-check.sh is the canonical check; this job runs it
# unmodified on a runner with no sibling checkouts by construction.
#
# NOTE: GitHub Actions is billing-blocked for this account as of 2026-07-02,
# so this lane is verified by local runs of the same script (fresh clone in a
# temp dir) until CI unblocks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Agents push to main in bursts; only the newest commit's proof matters, so
# cancel superseded runs instead of paying for each.
concurrency:
  group: all-aboard-cold-clone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # vendor/ibex is a private-repo submodule; the default GITHUB_TOKEN
          # only reads this repository. Fine-grained PAT, Contents: read on
          # ccheever/snapback + ccheever/ibex. (ENG-22480 phase 2: the extra
          # Contents: read grant on ccheever/exact is no longer needed — the
          # Exact side of this lane installs from the public npm registry.)
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev

      - name: Cache Hermes Linux build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/exact/hermes-linux
            vendor/ibex/linux
            vendor/ibex/tools/hermes
          key: ${{ runner.os }}-hermes-${{ hashFiles('vendor/ibex/scripts/build-hermes-linux.sh', 'vendor/ibex/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-hermes-

      # Cargo registry + target cache: without it every run cold-compiles the
      # full dependency tree (and the ibex-runtime C++ glue) on a 2-core
      # runner — the dominant per-run cost.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # Step 1 (registry install + production build) and step 2 (the 14-check
      # browser acceptance, Chrome ships on ubuntu-latest) both live in the
      # script so local runs and CI exercise one code path. No
      # continue-on-error, no fallback: if the install, the build, or any
      # check fails, this job is red.
      - name: Cold-clone check (registry install + build + browser acceptance)
        run: scripts/cold-clone-check.sh
