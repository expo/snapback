name: local-proof

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Agents push to main in bursts; only the newest commit's proof matters, so
# cancel superseded runs instead of paying for each.
concurrency:
  group: local-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false
          # Guide freshness compares reviewed authority commits against HEAD;
          # a depth-1 checkout turns every historical review identity into an
          # unverifiable warning instead of running the intended audit.
          fetch-depth: 0
          # vendor/ibex is a private-repo submodule; the default GITHUB_TOKEN
          # only reads this repository. Fine-grained PAT, Contents: read on
          # ccheever/snapback + ccheever/ibex.
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Verify checkout credentials were removed
        run: scripts/check-checkout-credentials

      # The standard GitHub-hosted Linux runner exposes a 14 GiB workspace
      # budget, while its image also preinstalls Android and .NET toolchains
      # this Rust/JS proof never uses. The native Ibex clippy + test profiles
      # can otherwise fill the runner before the in-proof Cargo cleanup point.
      # These are exact image-owned paths on this fresh ephemeral VM; refuse
      # early if reclaiming them still leaves too little room for the proof.
      - name: Reclaim unused GitHub-hosted runner disk
        shell: bash
        run: |
          set -euo pipefail
          readonly ci_unused_paths=(
            /usr/local/lib/android
            /usr/share/dotnet
            /usr/local/.ghcup
          )
          for ci_unused_path in "${ci_unused_paths[@]}"; do
            if [[ -e "$ci_unused_path" ]]; then
              sudo rm -rf --one-file-system -- "$ci_unused_path"
            fi
          done
          readonly ci_available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'END { print $4 }')"
          readonly ci_required_kib=$((20 * 1024 * 1024))
          if (( ci_available_kib < ci_required_kib )); then
            echo "SNAPBACK_CI_DISK_HEADROOM_LOW: ${ci_available_kib} KiB available after hosted-runner cleanup; ${ci_required_kib} KiB required" >&2
            exit 1
          fi
          echo "[snapback-ci] ${ci_available_kib} KiB available for canonical proof"

      # ENG-24513: .node-version is the single exact Node runtime authority;
      # check-toolchain-authority asserts the active runtime matches it.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # The canonical proof regenerates committed artifacts and exercises the
      # Cloudflare twin, both of which import root lockfile dependencies. A
      # clean runner must prove those exact dependencies instead of inheriting
      # an ambient node_modules tree (ENG-24385).
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev

      - name: Cache Hermes Linux build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/exact/hermes-linux
            vendor/ibex/linux
            vendor/ibex/tools/hermes
          # Reuse only an artifact built from this exact pin, patch stack, and
          # application/build logic. A prefix fallback can silently restore a
          # stale runtime after any of those inputs change.
          key: ${{ runner.os }}-hermes-${{ hashFiles('vendor/ibex/scripts/hermes-version.sh', 'vendor/ibex/scripts/apply-hermes-patches.sh', 'vendor/ibex/scripts/build-hermes-linux.sh', 'vendor/ibex/patches/hermes/*.patch', 'vendor/ibex/Cargo.toml') }}

      # Cargo registry + target cache: without it every run cold-compiles the
      # full dependency tree (and the ibex-runtime C++ glue) on a 2-core
      # runner — the dominant per-run cost.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # An exact-identity cache miss is expected whenever the pin, patch stack,
      # or build logic changes. Materialize and launch-test that runtime before
      # verify-local-proof reaches its read-only ibex-doctor preflight.
      - name: Prepare exact Hermes runtime
        run: scripts/bootstrap-ibex-runtime

      # ENG-24383: verify-local-proof denies both vulnerabilities and
      # unmaintained runtime dependencies. Pin the auditing tool so the gate's
      # own CLI/lock resolution cannot drift under an otherwise unchanged PR.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Verify Snapback local proof
        env:
          SNAPBACK_VERIFY_EXACT: "1"
        run: scripts/verify-local-proof
