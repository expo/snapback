name: local-proof

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# @ref LLP 0175#d23-complete-latest-main-proof — pushes get an affected
# per-change verdict, while schedule/manual runs finish one complete snapshot
# and coalesce newer pending main heads instead of creating a full-proof queue.
# Push groups are commit-unique: GitHub may replace an older pending run in a
# shared concurrency group, and a later event's before..HEAD diff does not
# contain an independently pushed commit that was discarded that way.
concurrency:
  group: local-proof-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'latest-main' || (github.event_name == 'push' && github.sha || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  local-proof:
    runs-on: expo-large
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Guide freshness compares reviewed authority commits against HEAD;
          # a depth-1 checkout turns every historical review identity into an
          # unverifiable warning instead of running the intended audit.
          fetch-depth: 0

      - name: Verify checkout credentials were removed
        run: scripts/check-checkout-credentials

      # ENG-24513: .node-version is the single exact Node runtime authority;
      # check-toolchain-authority asserts the active runtime matches it.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      # @ref LLP 0175#d2--assign-every-test-to-an-explicit-cadence — compute
      # the checked path-to-gate closure before installing heavyweight tools.
      # The exact receipt is reopened by verify-local-proof and uploaded with
      # its gate results. Keep it outside target/: the Rust cache restore owns
      # that tree and may replace it after this planning step. Selector,
      # workflow, and shared-authority changes fail broad.
      - name: Plan affected or complete proof
        id: selection
        env:
          PROOF_CADENCE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'complete' || 'affected' }}
          PROOF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PROOF_SELECTION: ${{ runner.temp }}/local-proof-selection.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PROOF_SELECTION")"
          selection_args=(
            plan
            --cadence "$PROOF_CADENCE"
            --head HEAD
            --output "$PROOF_SELECTION"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ "$PROOF_CADENCE" = affected ]; then
            case "$PROOF_BASE" in
              0000000000000000000000000000000000000000|'')
                echo 'SNAPBACK_LOCAL_PROOF_SELECTION_BASE_MISSING' >&2
                exit 1
                ;;
            esac
            selection_args+=(--base "$PROOF_BASE")
          fi
          node scripts/select-local-proof.mjs "${selection_args[@]}"

      # The repository intentionally keeps the large Ibex runtime submodule
      # demand-loaded. Fast docs/guide selections do not pay its clone cost;
      # every affected code or complete selection reaches native readiness
      # through the mandatory Contract/Exact boundary and initializes it.
      - name: Initialize native runtime submodules
        if: steps.selection.outputs.requires_native == 'true'
        run: |
          git submodule update --init --recursive
          scripts/check-checkout-credentials

      # Native profiles can fill a small runner before the in-proof cleanup
      # point. Fast docs/guide selections never need this 20 GiB admission
      # gate, so apply it only when the selected closure owns native work.
      - name: Require workspace disk headroom
        if: steps.selection.outputs.requires_native == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ci_available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'END { print $4 }')"
          readonly ci_available_kib
          readonly ci_required_kib=$((20 * 1024 * 1024))
          if (( ci_available_kib < ci_required_kib )); then
            echo "SNAPBACK_CI_DISK_HEADROOM_LOW: ${ci_available_kib} KiB available; ${ci_required_kib} KiB required" >&2
            exit 1
          fi
          echo "[snapback-ci] ${ci_available_kib} KiB available for selected native proof"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.selection.outputs.requires_javascript_dependencies == 'true'
        with:
          bun-version-file: package.json

      # The canonical proof regenerates committed artifacts and exercises the
      # Cloudflare twin, both of which import root lockfile dependencies. A
      # clean runner must prove those exact dependencies instead of inheriting
      # an ambient node_modules tree (ENG-24385).
      - name: Install JavaScript dependencies
        if: steps.selection.outputs.requires_javascript_dependencies == 'true'
        run: |
          bun install --frozen-lockfile
          node scripts/ensure-workspace-hoist.mjs

      - name: Install native build dependencies
        if: steps.selection.outputs.requires_native == 'true'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev lsof

      # @ref LLP 0010#ci-and-review-gates — the admin behavior lane is required.
      # @ref LLP 0015#acceptance-rules — a missing required browser is a failure,
      # never a skip. The self-hosted expo-large image does not carry the Chrome
      # binary that ubuntu-latest supplied implicitly, so provision a real
      # browser and pass its exact action-owned path to the canonical proof.
      - name: Install Chrome for browser acceptance
        id: setup-chrome
        if: steps.selection.outputs.requires_browser == 'true'
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: stable

      - name: Cache Hermes Linux build
        if: steps.selection.outputs.requires_native == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/exact/hermes-linux
            vendor/ibex/linux
            vendor/ibex/tools/hermes
          # Reuse only an artifact built from this exact pin, patch stack, and
          # application/build logic. A prefix fallback can silently restore a
          # stale runtime after any of those inputs change.
          key: ${{ runner.os }}-hermes-${{ hashFiles('vendor/ibex/scripts/hermes-version.sh', 'vendor/ibex/scripts/apply-hermes-patches.sh', 'vendor/ibex/scripts/build-hermes-linux.sh', 'vendor/ibex/patches/hermes/*.patch', 'vendor/ibex/Cargo.toml') }}

      # The self-hosted expo image ships no Rust toolchain (cargo ENOENT),
      # unlike GitHub's ubuntu-latest. Install rustup bare, then let
      # rust-toolchain.toml select the reviewed compiler authority.
      # @ref LLP 0175#d2--assign-every-test-to-an-explicit-cadence — rustfmt is
      # path-owned and needs only this cheap toolchain step, not the native
      # submodule, Hermes, cache, or bootstrap closure.
      - name: Install the pinned Rust toolchain
        if: steps.selection.outputs.requires_rust_toolchain == 'true'
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install
          rustup show active-toolchain

      # Cargo registry + target cache: without it every run cold-compiles the
      # full dependency tree (and the ibex-runtime C++ glue) — the dominant
      # per-run cost.
      - name: Cache Rust build
        if: steps.selection.outputs.requires_native == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # An exact-identity cache miss is expected whenever the pin, patch stack,
      # or build logic changes. Materialize and launch-test that runtime before
      # verify-local-proof reaches its read-only ibex-doctor preflight.
      - name: Prepare exact Hermes runtime
        if: steps.selection.outputs.requires_native == 'true'
        run: scripts/bootstrap-ibex-runtime

      # ENG-24383: verify-local-proof denies both vulnerabilities and
      # unmaintained runtime dependencies. Pin the auditing tool so the gate's
      # own CLI/lock resolution cannot drift under an otherwise unchanged PR.
      - name: Install cargo-audit
        if: steps.selection.outputs.requires_cargo_audit == 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Verify Snapback local proof
        env:
          # Three ubuntu-latest runs crashed rust-lld with SIGBUS across
          # integration tests and the normal binary. Bound concurrency and
          # omit CI-only debug symbols so native links stay inside the fresh
          # runner's mmap, memory, and disk budget.
          CARGO_BUILD_JOBS: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          SNAPBACK_VERIFY_EXACT: "1"
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          SNAPBACK_PROOF_RESULTS: ${{ github.workspace }}/target/proof/local-proof-results.jsonl
          SNAPBACK_PROOF_SELECTION_RESULTS: ${{ runner.temp }}/local-proof-selection.json
          SNAPBACK_APP_CLI_TEST_PRIVATE_ROOT: /opt/snapback-app-cli-test-${{ github.run_id }}
          # One red round names every broken gate instead of only the first
          # (issues/20260802-verify-local-proof-stops-at-the-first-failure.md).
          SNAPBACK_PROOF_KEEP_GOING: "1"
        run: |
          # @ref LLP 0062#4-auth-the-existing-model-projected--with-explicit-selection
          # The shared runner checkout has an unsafe /home/runner ancestor;
          # prove real credential custody from a private, root-safe hierarchy.
          if [ "${{ steps.selection.outputs.requires_private_root }}" = true ]; then
            case "$SNAPBACK_APP_CLI_TEST_PRIVATE_ROOT" in
              /opt/snapback-app-cli-test-[0-9]*) ;;
              *) echo "refusing unsafe app-CLI test root" >&2; exit 2 ;;
            esac
            sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" \
              "$SNAPBACK_APP_CLI_TEST_PRIVATE_ROOT"
            trap 'sudo rm -rf -- "$SNAPBACK_APP_CLI_TEST_PRIVATE_ROOT"' EXIT
          fi
          scripts/verify-local-proof --selection-receipt "$SNAPBACK_PROOF_SELECTION_RESULTS"

      # @ref LLP 0189#decision — GitHub's read-only checkout reports the
      # complete-battery verdict. The local scheduled backstop owns durable
      # signature-ticket mutation and commits that state to the repository.
      - name: Report complete-battery verdict
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          SNAPBACK_PROOF_RESULTS: ${{ github.workspace }}/target/proof/local-proof-results.jsonl
        run: |
          set -euo pipefail
          test -s "$SNAPBACK_PROOF_RESULTS" || {
            echo 'SNAPBACK_BATTERY_RESULTS_MISSING: complete proof emitted no structured results' >&2
            exit 2
          }
          node scripts/drift-prone-gates.mjs battery-report \
            --results "$SNAPBACK_PROOF_RESULTS"

      # @ref LLP 0175#d5--make-test-economics-part-of-the-inventory — retain
      # every named gate's duration and PASS/FAIL/BLOCKED state even on red.
      - name: Upload local-proof gate timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-proof-gate-results-${{ github.run_id }}
          path: |
            target/proof/local-proof-results.jsonl
            target/proof/template-registry-canary.json
            ${{ runner.temp }}/local-proof-selection.json
          if-no-files-found: warn
