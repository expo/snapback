name: inventories

# The generated inventories (diagnostics registry, guide projections, package
# test inventory, agent-safe publication leaf set) are repository state that
# landings must keep in step with their source. Until this lane existed nothing
# failed the OFFENDING commit: a landing that added a diagnostic emission, a
# test file, or a publication leaf without regenerating left main red for
# whoever pushed next, who then had to diagnose a failure they did not cause.
#
# That happened four distinct times on 2026-08-21/22 — twice on stale
# diagnostics projections, once on an unregistered test file, once on a stale
# publication leaf row. The check is fast, deterministic, and touches only docs
# and registries, so it belongs on the offending commit rather than on the next
# agent's landing. See
# issues/20260821-check-inventories-has-no-mechanical-enforcement.md.
#
# scripts/check-inventories.mjs is the same entry point agents are asked to run
# before pushing, so local runs and CI exercise one code path.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Agents push to main in bursts; only the newest commit's inventory state
# matters.
concurrency:
  group: inventories-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventories:
    runs-on: expo-small
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify checkout credentials were removed
        run: scripts/check-checkout-credentials

      # Consume the root .node-version authority instead of floating the Node
      # patch release.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # The guide manifest inventory runs the generators, which need the root
      # lockfile's parser dependencies. No submodules, no Hermes, no
      # credentials.
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated inventories are in step with their source
        run: node scripts/check-inventories.mjs
