name: ref-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ref-check:
    runs-on: expo-small
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify checkout credentials were removed
        run: scripts/check-checkout-credentials
      - name: Validate LLP references and metadata
        run: ./ref-check --verbose
