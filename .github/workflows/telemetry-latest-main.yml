name: telemetry-latest-main

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# @ref LLP 0175#d23-complete-latest-main-proof — continuous main churn is
# normal: finish the running snapshot, retain at most one pending snapshot,
# and let a newer schedule replace an older pending run rather than queueing
# one full proof per commit.
concurrency:
  group: telemetry-latest-main
  cancel-in-progress: false

jobs:
  full-evidence-candidate:
    runs-on: expo-large
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0

      - name: Verify checkout credentials were removed
        run: scripts/check-checkout-credentials

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Install native proof dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev sqlite3

      - name: Cache Hermes Linux build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/exact/hermes-linux
            vendor/ibex/linux
            vendor/ibex/tools/hermes
          key: ${{ runner.os }}-hermes-${{ hashFiles('vendor/ibex/scripts/hermes-version.sh', 'vendor/ibex/scripts/apply-hermes-patches.sh', 'vendor/ibex/scripts/build-hermes-linux.sh', 'vendor/ibex/patches/hermes/*.patch', 'vendor/ibex/Cargo.toml') }}

      - name: Install the pinned Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install
          rustup show active-toolchain

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Produce exact latest-head telemetry evidence
        env:
          CARGO_BUILD_JOBS: '1'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          SNAPBACK_TELEMETRY_PHASE1_RECEIPT: ${{ runner.temp }}/telemetry-phase1-evidence.v1.json
        run: scripts/verify-telemetry-phase1-proof --full

      - name: Summarize measured snapshot
        env:
          CANDIDATE: ${{ runner.temp }}/telemetry-phase1-evidence.v1.json
        run: |
          jq '{
            schemaVersion,
            createdAt,
            sourceRevision,
            sourceDigest: .sourceInputs.digest,
            idleCpuTicks: .idle.idle.resources.cpuTicksDelta,
            idleCpuTickCeiling: .idle.idle.resourceCeilings.cpuTicksDelta
          }' "$CANDIDATE" | tee "${CANDIDATE%.json}.summary.json"
          {
            echo '## Rolling telemetry evidence candidate'
            echo
            echo 'This run proves its exact source revision even if `main` advanced while it ran.'
            echo 'The candidate may be retained later as historical evidence; release and capability promotion still require an exact-current candidate.'
            echo
            echo '```json'
            cat "${CANDIDATE%.json}.summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable evidence candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telemetry-phase1-${{ github.sha }}
          path: |
            ${{ runner.temp }}/telemetry-phase1-evidence.v1.json
            ${{ runner.temp }}/telemetry-phase1-evidence.v1.summary.json
          if-no-files-found: error
          retention-days: 30
