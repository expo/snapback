<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__TITLE__</title>
<link rel="icon" href="__FAVICON_HREF__" type="image/svg+xml" />
<!-- @ref LLP 0017#instance-home-page — unlike the Contract admin console, this page is one
     self-contained file served by the Snapback server itself; no build step,
     no external assets. -->
<!-- @ref LLP 0031#resolved-decisions — D3: everything rendered here comes from
     the public InstanceStatus object; nothing on this page may exceed it. -->
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #fafbfc;
    --border: #e3e5ea;
    --border-strong: #d4d7df;
    --text: #1c1d21;
    --muted: #6b7280;
    --faint: #9aa1ad;
    --accent: #5e6ad2;
    --accent-soft: #eceefb;
    --ink: #111111;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius: 8px;
    --shadow: 0 1px 2px rgba(17, 20, 24, 0.04), 0 1px 3px rgba(17, 20, 24, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --surface: #1d1f23;
      --surface-2: #212327;
      --border: #2c2f35;
      --border-strong: #3a3e45;
      --text: #e7e8ea;
      --muted: #9aa1ad;
      --faint: #6b7280;
      --accent: #8b95ec;
      --accent-soft: #262a44;
      --ink: #ffffff;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: var(--accent); }

  header.topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: inline-flex; align-items: center; gap: 9px;
    color: var(--ink); text-decoration: none;
  }
  .brand svg { height: 18px; width: auto; display: block; }
  .brand .wordmark { font-weight: 700; font-size: 15px; letter-spacing: 0; color: var(--text); }
  .brand small { color: var(--muted); font-weight: 500; }
  main { width: 100%; max-width: 980px; margin: 0; padding: 30px 24px 20px; flex: 1; }

  .hero { text-align: left; padding: 8px 0 22px; }
  .hero .snapback-mark svg { height: 56px; width: auto; color: var(--ink); }
  .hero .identity { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 16px; }
  .hero img.app-icon { height: 72px; width: 72px; border-radius: 16px; display: block; object-fit: cover; border: 1px solid var(--border); background: var(--surface); }
  .hero img.app-wordmark { max-height: 44px; max-width: min(420px, 100%); display: block; }
  .hero h1 { margin: 0; font-size: 28px; letter-spacing: 0; line-height: 1.15; }
  .hero p.desc { margin: 10px 0 0; max-width: 680px; color: var(--muted); font-size: 15px; }
  .hero p.sub { margin: 6px 0 0; color: var(--faint); font-size: 13px; }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding-bottom: 24px; }
  .actions a.primary {
    display: inline-flex; align-items: center; gap: 9px; text-decoration: none;
    background: var(--accent); color: #fff;
    font-weight: 600; font-size: 14px;
    padding: 10px 22px; border-radius: 8px;
    box-shadow: var(--shadow);
  }
  .actions a.primary svg { width: 16px; height: 16px; stroke-width: 2.2; flex: 0 0 auto; }
  .actions a.primary:hover { filter: brightness(1.05); }

  .guide-note {
    margin: 0 0 24px;
    padding: 12px 14px;
    max-width: 760px;
    color: var(--muted);
    background: var(--accent-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .guide-note strong { color: var(--text); }

  .facts { padding-bottom: 26px; }
  .facts h2 {
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0;
  }
  .facts table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .facts th, .facts td {
    text-align: left;
    vertical-align: top;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .facts tr:last-child th, .facts tr:last-child td { border-bottom: 0; }
  .facts th {
    width: 16%;
    white-space: nowrap;
    color: var(--faint);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0;
    background: var(--surface-2);
  }
  /* Divider between the two key/value pair columns. */
  .facts td + th { border-left: 1px solid var(--border); }
  .facts td {
    width: 34%;
    font-size: 14px;
    color: var(--text);
    overflow-wrap: anywhere;
  }
  .facts td.mono { font-family: var(--mono); font-size: 12.5px; }

  details.details {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 26px;
  }
  details.details summary {
    cursor: pointer; user-select: none;
    padding: 11px 14px; font-weight: 600; font-size: 13px; color: var(--muted);
  }
  details.details[open] summary { border-bottom: 1px solid var(--border); color: var(--text); }
  details.details pre {
    margin: 0; padding: 14px; overflow-x: auto;
    font-family: var(--mono); font-size: 12px; line-height: 1.55;
    background: var(--surface-2); color: var(--text);
    border-radius: 0 0 var(--radius) var(--radius);
  }
  .utility-links {
    display: grid; gap: 4px;
    margin: -12px 0 24px;
    font-family: var(--mono); font-size: 12px;
  }
  .utility-links a { color: var(--muted); text-decoration: none; }
  .utility-links a:hover { color: var(--accent); text-decoration: underline; }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="https://github.com/ccheever/snapback">__SNAPBACK_MARK__<span class="wordmark">Snapback</span></a>
</header>
<main>
  <section class="hero">
__HERO__
  </section>
  <section class="actions">
    <a class="primary" href="/_snapback/admin">__LOCK_ICON__<span>Open admin console</span></a>
  </section>
  <aside class="guide-note" aria-label="Snapback Guide">
    __GUIDE_NOTE__
  </aside>
  <section class="facts">
    <h2>Instance properties</h2>
__FACTS__
  </section>
  <details class="details">
    <summary>More details</summary>
    <pre>__DETAILS_YAML__</pre>
  </details>
  <nav class="utility-links" aria-label="Instance endpoints">
    <a href="/_snapback/api/health">/_snapback/api/health</a>
    <a href="/_snapback/api/inspect">/_snapback/api/inspect</a>
  </nav>
</main>
</body>
</html>
