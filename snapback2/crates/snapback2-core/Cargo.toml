[package]
name = "snapback2-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Snapback 2 data plane: bounded data programs — IR, certificate, engine, trace, client replay."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
argon2 = "0.5"
getrandom = "0.3"

[dev-dependencies]
pretty_assertions = "1"

[build-dependencies]
sha2 = "0.10"
