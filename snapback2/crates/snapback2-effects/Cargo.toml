[package]
name = "snapback2-effects"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The effect seam. The only crate that may link a JS engine (Ibex 2), and only with the `hermes` feature."

[dependencies]
getrandom = "0.3"
serde_json = "1"
snapback2-core = { path = "../snapback2-core" }
thiserror = "2"
# Ibex 2 (LLP 0057/0058 in expo/ibex1, the archived repo this pin predates): a Rust standard library with JS bindings
# over vanilla, pinned Hermes. `default-features = false` = no Oxc loader, no
# engine: this crate builds from crates.io alone. The engine is `hermes`.
ibex2 = { git = "https://github.com/expo/ibex1", rev = "49fa9841212cf1fc119a3f8dcd246b1f9ab71ea8", default-features = false }

[features]
default = []
hermes = ["ibex2/hermes"]
loader = ["ibex2/loader"]
