[package]
name = "snapback2-effects"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The effect seam. The only crate that may link a JS engine (Ibex 2), and only with the `hermes` feature."

[dependencies]
serde_json = "1"
snapback2-core = { path = "../snapback2-core" }
thiserror = "2"
# Ibex 2 (LLP 0057/0058 in expo/ibex): a Rust standard library with JS bindings
# over vanilla, pinned Hermes. `default-features = false` = no Oxc loader, no
# engine: this crate builds from crates.io alone. The engine is `hermes`.
ibex2 = { git = "https://github.com/expo/ibex", rev = "12dfbf3fd20fe0986768a3a5443972d38e69566c", default-features = false }

[features]
default = []
hermes = ["ibex2/hermes"]
loader = ["ibex2/loader"]
