[package]
name = "snapback2-effects"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The effect seam. The only crate that may link a JS engine (Ibex 2), and only with the `hermes` feature."

[dependencies]
getrandom = "0.3"
serde_json = "1"
snapback2-core = { path = "../snapback2-core" }
thiserror = "2"
# Ibex 2's owning Hermes runtime, pinned with its verified lean-engine bundle.
# It stays optional because this crate's default build must link no engine.
ibex2-runtime = { git = "https://github.com/expo/ibex", rev = "2aac9fa5b760f0e3c81c5e628d073bd9927acc55", default-features = false, optional = true }

[features]
default = []
hermes = ["dep:ibex2-runtime"]
