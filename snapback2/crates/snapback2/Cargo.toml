[package]
name = "snapback2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Snapback 2 — the binary. Verbs per LLP 0329.016 §5.11, added as they exist."

[dependencies]
snapback2-core = { path = "../snapback2-core" }
snapback2-effects = { path = "../snapback2-effects", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
effects = ["dep:snapback2-effects"]
hermes = ["effects", "snapback2-effects/hermes"]
