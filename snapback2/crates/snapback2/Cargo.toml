[package]
name = "snapback2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Snapback 2 — the binary. Verbs per LLP 0329.016 §5.11, added as they exist."

[dependencies]
snapback2-core = { path = "../snapback2-core" }
snapback2-effects = { path = "../snapback2-effects" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = { path = "../../vendor/tiny_http" }
getrandom = "0.3"
subtle = "2"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }

[features]
default = []
effects = []
hermes = ["effects", "snapback2-effects/hermes"]
